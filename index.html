<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>komorebi</title>
    <meta name="description" content="Sunlight filtering through leaves, and the dance of light and shadow where it falls. At your time of day." />
    <meta name="theme-color" content="#f3f1ec" />

    <meta property="og:url" content="https://komorebi-light.vercel.app/" />

    <meta property="og:description" content="Sunlight filtering through leaves, and the dance of light and shadow where it falls. At your time of day." />
    <meta property="og:image" content="https://komorebi-light.vercel.app/og.jpg" />
    <meta property="og:image:alt" content="Morning sunlight through leaves on textured paper, with 木漏れ日 and the word komorebi, its definition and a time-of-day slider" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:title" content="komorebi" />
    <meta name="twitter:description" content="Sunlight filtering through leaves, and the dance of light and shadow where it falls. At your time of day." />
    <meta name="twitter:image" content="https://komorebi-light.vercel.app/og.jpg" />
    <meta name="twitter:image:alt" content="Morning sunlight through leaves on textured paper, with 木漏れ日 and the word komorebi, its definition and a time-of-day slider" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&display=swap&text=%E6%9C%A8%E6%BC%8F%E3%82%8C%E6%97%A5%E6%9C%88" rel="stylesheet" />
    <!-- Fraunces has no IPA letters; these two come from Noto Serif, at the same weight. -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@100..900&display=swap&text=%C9%BE%C9%AF" rel="stylesheet" />
    <link rel="preload" href="/fonts/fraunces-voice-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // The words are drawn as dissolving ink. Hide the page's own letters before
      // first paint so they do not show and then vanish; shown again if the
      // effect cannot start.
      (function () {
        if (!window.WebGL2RenderingContext || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var root = document.documentElement;
        root.classList.add('dissolve-pending');
        setTimeout(function () { root.classList.remove('dissolve-pending'); }, 3000);
      })();
    </script>
    <style>
      /* Fraunces Voice: Fraunces with optical size 12, softness 100 and wonk 0
         fixed (scripts/instance-font.py), as in studies/type-voice, so the page
         and the dissolve effect's canvas draw the same letters. SIL OFL. */
      @font-face {
        font-family: 'Fraunces Voice';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/fraunces-voice-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Fraunces Voice';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/fraunces-voice-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Fraunces Voice';
        font-style: italic;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/fraunces-voice-latin-italic.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Fraunces Voice';
        font-style: italic;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/fraunces-voice-latin-ext-italic.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      :root {
        color-scheme: light;
        --paper: #f3f1ec;
        --ink: #413a39; /* the voice's warm graphite */
        --text-weight: 260;
        --word-weight: 230;
        /* Sizes, set from the view in src/layout.js. */
        --word: 75px;
        --kanji: 45px;
        --text: 19px;
        --leading: 29px;
        --say: 17px;
        --w: 560px;
        --margin: 108px;
        --bottom: 117px;
        --top: 72px;
        --row: 44px;
        --thumb: 9px;
      }
      /* At night the page is in dark mode: pale ink on dark paper, a little
         lighter in weight, as light on dark reads heavier. */
      :root[data-theme='dark'] {
        color-scheme: dark;
        --paper: #12151c;
        --ink: #ddd6ca;
        --text-weight: 240;
        --word-weight: 210;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        overflow: hidden;
      }
      #study {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
        touch-action: manipulation;
      }
      #fallback {
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      #fallback img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      /* Composed like a dictionary card: the Japanese down the top right, the
         word, how it is said and what it means low on the left, and with them
         the time of day. */
      .stage {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-kerning: normal;
        font-feature-settings: 'kern', 'liga';
        transition: color 0.8s ease;
      }
      .kanji {
        position: absolute;
        top: var(--top);
        right: var(--margin);
        margin: 0;
        writing-mode: vertical-rl;
        text-orientation: upright;
        font: 500 var(--kanji) / 1 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
        letter-spacing: 0.3em;
      }
      .entry {
        position: absolute;
        left: var(--margin);
        bottom: var(--bottom);
        width: var(--w);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .word {
        margin: 0 0 0 -0.03em; /* the k's side bearing, so its stem lines up with the text */
        font: var(--word-weight) var(--word) / 1 'Fraunces Voice', Georgia, serif;
        letter-spacing: 0.035em;
      }
      .say {
        margin: calc(var(--word) * 0.2) 0 0;
        font: var(--text-weight) var(--say) / 1.4 'Fraunces Voice', 'Noto Serif', Georgia, serif;
        letter-spacing: 0.01em;
      }
      .say .pos {
        margin-left: 0.6em;
      }
      .meaning {
        margin: calc(var(--leading) * 0.85) 0 0;
        font: var(--text-weight) var(--text) / var(--leading) 'Fraunces Voice', Georgia, serif;
        text-wrap: pretty;
      }
      /* While the dissolve effect draws them, the page's own letters stay in
         place, transparent, for selection and screen readers. */
      .dissolve-pending [data-dissolve],
      .dissolve-on [data-dissolve] {
        color: transparent;
        transition: none;
      }
      .dissolve-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
      }
      /* While a clip is recorded, the page's own transitions are replaced by
         ones that run on the clip's clock. */
      .is-recording,
      .is-recording * {
        transition: none !important;
      }
      .dissolve-ink-probe {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
        color: var(--ink);
        transition: color 0.8s ease;
      }
      /* The time of day: play, a scale of the hours, the time; then "now" and
         "sound". */
      .controls {
        width: 100%;
        margin-top: calc(var(--leading) * 0.9);
      }
      .controls[hidden] {
        display: none;
      }
      .day,
      .toggles {
        font: 400 13px/1 ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        pointer-events: auto;
      }
      .day {
        display: flex;
        align-items: flex-start;
        width: 100%;
        opacity: 0.74;
        transition: opacity 0.5s ease;
      }
      .controls:hover .day,
      .day:focus-within,
      .controls.is-active .day {
        opacity: 0.95;
      }
      /* The sky's diagram (src/sunpath.js), with the range input over it. */
      .sky {
        position: relative;
        flex: 1;
        height: 78px;
      }
      .sky canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }
      .day-range {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: none;
        color: inherit;
        -webkit-appearance: none;
        appearance: none;
        cursor: grab;
        touch-action: none;
      }
      .controls.is-dragging .day-range {
        cursor: grabbing;
      }
      .day-range::-webkit-slider-runnable-track {
        height: 100%;
        background: none;
        border: 0;
      }
      .day-range::-moz-range-track {
        height: 100%;
        background: none;
        border: 0;
      }
      /* The playhead is drawn; the thumb stays only to be held. */
      .day-range::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: var(--thumb);
        height: 100%;
        border: 0;
        background: none;
      }
      .day-range::-moz-range-thumb {
        width: var(--thumb);
        height: 100%;
        border: 0;
        border-radius: 0;
        background: none;
      }
      .day-range:focus,
      .day-play:focus,
      .day-now:focus,
      .sound:focus,
      .rest:focus {
        outline: none;
      }
      .day-range:focus-visible,
      .day-play:focus-visible,
      .day-now:focus-visible,
      .sound:focus-visible,
      .rest:focus-visible {
        outline: 1px solid currentColor;
        outline-offset: 3px;
        border-radius: 3px;
      }
      .day-play {
        flex: none;
        width: 30px;
        height: 30px;
        margin: 41px 6px 0 -11px; /* on the horizon; the triangle's point lines up with the text */
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .day-play svg {
        width: 11px;
        height: 11px;
        display: block;
        fill: currentColor;
      }
      /* Play and pause trade places, each shrinking and softening away. */
      .day-play .i-play,
      .day-play .i-pause {
        transform-box: fill-box;
        transform-origin: center;
        transition: opacity 0.22s ease, transform 0.32s cubic-bezier(0.2, 0.9, 0.3, 1), filter 0.22s ease;
      }
      .day-play .i-pause,
      .day-play[aria-pressed='true'] .i-play {
        opacity: 0;
        transform: scale(0.55);
        filter: blur(1.5px);
      }
      .day-play[aria-pressed='true'] .i-pause {
        opacity: 1;
        transform: none;
        filter: none;
      }
      .day-play:active svg {
        transform: scale(0.9);
      }
      .day-play svg {
        transition: transform 0.15s ease;
        overflow: visible;
      }
      .toggles {
        display: flex;
        gap: 20px;
        margin: 4px 0 0 -1px; /* the first icon lines up with the text */
        opacity: 0.74;
        transition: opacity 0.5s ease;
      }
      .controls:hover .toggles,
      .toggles:focus-within {
        opacity: 0.95;
      }
      .day-now,
      .sound,
      .rest {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
        cursor: pointer;
        opacity: 0.6;
        transition: opacity 0.3s ease;
      }
      .sound[hidden] {
        display: none;
      }
      /* Each switch's icon (src/icons.js). */
      .icon {
        flex: none;
        display: block;
        width: 12px;
        height: 12px;
      }
      .day-now[aria-pressed='true'],
      .sound[aria-pressed='true'],
      .day-now:hover,
      .sound:hover,
      .rest:hover {
        opacity: 1;
      }
      /* The screensaver: the light alone. The words lift away through the
         dissolve; the rest fades, and the pointer hides. */
      .stage,
      .foot {
        transition: opacity 1.2s ease, color 0.8s ease;
      }
      .dissolve-canvas {
        transition: opacity 1.6s ease;
      }
      .resting .stage,
      .resting .foot,
      .resting .dissolve-canvas {
        opacity: 0;
        pointer-events: none;
      }
      .resting .stage *,
      .resting .foot * {
        pointer-events: none !important;
      }
      .resting,
      .resting body {
        cursor: none;
      }
      /* The author and the code, at the very bottom. */
      .foot {
        position: fixed;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
        transform: translateX(-50%);
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 22px;
        color: var(--ink);
        font: 400 13px/1 ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        letter-spacing: 0.01em;
        -webkit-font-smoothing: antialiased;
        white-space: nowrap;
      }
      .credit,
      .code {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 0;
        color: inherit;
        text-decoration: none;
        opacity: 0.55;
        transition: opacity 0.3s ease;
      }
      .credit:hover,
      .credit:focus-visible,
      .code:hover,
      .code:focus-visible {
        opacity: 0.95;
        outline: none;
      }
      .credit:focus-visible,
      .code:focus-visible {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <canvas id="study" aria-label="Sunlight through a window and leaves, moving on textured paper" role="img"></canvas>
    <main class="stage">
      <p class="kanji" lang="ja" data-dissolve>木漏れ日</p>
      <section class="entry" id="entry" aria-labelledby="word">
        <h1 class="word" id="word" data-dissolve>komorebi</h1>
        <p class="say" data-dissolve><span class="ipa">[ komoɾebi ]</span><span class="pos"><i>noun</i></span></p>
        <p class="meaning" data-dissolve>Sunlight filtering through leaves, and the dance of light and shadow where it falls, trembling with every breath of wind.</p>
        <div class="controls" id="controls" hidden>
          <div class="day" id="day">
            <button class="day-play" type="button" aria-label="Play the day" aria-pressed="false">
              <svg viewBox="0 0 10 10" aria-hidden="true">
                <path class="i-play" d="M2 1.2 8.6 5 2 8.8z" />
                <g class="i-pause"><rect x="1.8" y="1.4" width="2.1" height="7.2" /><rect x="6.1" y="1.4" width="2.1" height="7.2" /></g>
              </svg>
            </button>
            <div class="sky">
              <canvas aria-hidden="true"></canvas>
              <input class="day-range" type="range" aria-label="Time of day" />
            </div>
          </div>
          <div class="toggles">
            <button class="day-now" data-icon="now" type="button" aria-pressed="true" aria-label="Follow the time now"><canvas class="icon" aria-hidden="true"></canvas>now</button>
            <button class="sound" data-icon="sound" type="button" aria-pressed="false" aria-label="Sound" title="Satie, Gymnopédie No. 1, played by Robin Alciatore (Musopen, public domain)" hidden><canvas class="icon" aria-hidden="true"></canvas>sound</button>
            <button class="rest" data-icon="rest" type="button" aria-pressed="false" aria-label="Screensaver: the light alone, full screen" title="The light alone, full screen. Any key or movement brings the page back."><canvas class="icon" aria-hidden="true"></canvas>screensaver</button>
          </div>
        </div>
      </section>
    </main>
    <footer class="foot">
      <a class="credit" href="https://sandeepjoshi.in">sandeepjoshi.in</a>
      <a class="code" data-icon="code" href="https://github.com/sandypjoshi/komorebi-light" target="_blank" rel="noopener"><canvas class="icon" aria-hidden="true"></canvas>get the code</a>
    </footer>
    <picture id="fallback" hidden>
      <source media="(orientation: portrait)" srcset="/fallback/morning-portrait.jpg" />
      <img src="/fallback/morning-landscape.jpg" alt="Morning sunlight through a window and leaves on textured paper" />
    </picture>
    <noscript>
      <style>
        #fallback { display: block !important; }
        #study { display: none; }
      </style>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
